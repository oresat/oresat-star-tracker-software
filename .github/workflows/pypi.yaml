name: Build and Package

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  release:
    types: [ "published" ]

jobs:
  build_wheels:
    name: Build ${{ matrix.arch }} wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, armv7l]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up QEMU
        if: matrix.arch == 'armv7l'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.0
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD: "cp310-manylinux*"
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y cairo-devel eigen3-devel || 
            (apt-get update && apt-get install -y libcairo2-dev libeigen3-dev)

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  publish:
    # Only runs when triggered by a formal release event
    if: github.event_name == 'release'
    needs: build_wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
